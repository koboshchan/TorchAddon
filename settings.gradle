pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Include Wurst7 as a composite build for proper dependency resolution
if (file('wurst7-base/settings.gradle').exists())
    includeBuild 'wurst7-base'
