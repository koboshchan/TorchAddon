plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "wurstaddon" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Skip Wurst jar lookup when only running tasks in the included wurst7-base build.
    if (!isWurstBaseOnlyInvocation()) {
        // Resolve Wurst7 dependency from either submodule or sibling checkout.
        def wurstJar = findWurstJar()
        implementation files(wurstJar)
    }
}

def isWurstBaseOnlyInvocation() {
    def requestedTasks = []
    requestedTasks.addAll(gradle.startParameter.taskNames ?: [])

    for (def request : gradle.startParameter.taskRequests ?: []) {
        requestedTasks.addAll(request.args ?: [])
    }

    requestedTasks = requestedTasks.findAll { taskName ->
        return taskName != null && !taskName.isBlank() && !taskName.startsWith("-")
    }

    if (requestedTasks.isEmpty())
        return false

    return requestedTasks.every { taskName ->
        return taskName == "wurst7-base" || taskName == ":wurst7-base" ||
            taskName.startsWith("wurst7-base:") || taskName.startsWith(":wurst7-base:")
    }
}

def findWurstJar() {
    def candidateDirs = [
        file("wurst7-base/build/libs"),
        file("../Wurst7/build/libs")
    ]

    for (def dir : candidateDirs) {
        if (!dir.exists())
            continue

        def jars = dir.listFiles()?.findAll {
            return it.name.endsWith(".jar") && !it.name.endsWith("-sources.jar") && !it.name.endsWith("-dev.jar") && !it.name.endsWith("-javadoc.jar") && (it.name.contains("Wurst") || it.name.contains("wurst"))
        }?.sort { a, b -> b.lastModified() <=> a.lastModified() }

        if (jars && !jars.isEmpty())
            return jars.first().absolutePath
    }

    throw new GradleException(
        "Could not find a built Wurst7 jar. Build Wurst first in wurst7-base or ../Wurst7.")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
