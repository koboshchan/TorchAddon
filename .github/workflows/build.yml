name: Build WurstAddon

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    # checkout restores the exact Wurst commit pinned by our gitlink.
    # Never switch it to 1.21.1 or a moving branch: its render/addon APIs differ.
    - name: Verify pinned Minecraft dependency
      run: |
        expected=$(sed -n 's/^minecraft_version=//p' gradle.properties)
        actual=$(sed -n 's/^minecraft_version=//p' wurst7-base/gradle.properties)
        test "$expected" = "$actual" || { echo "Wurst Minecraft $actual != addon $expected"; exit 1; }

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Build Wurst7 (submodule)
      run: |
        cd wurst7-base
        chmod +x gradlew
        ./gradlew --no-daemon build -x test
        cd ..

    - name: Build WurstAddon
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WurstAddon-build
        path: |
          build/libs/*.jar
          wurst7-base/build/libs/*.jar
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/libs/*.jar
          wurst7-base/build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
